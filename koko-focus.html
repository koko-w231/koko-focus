<title>🦊 koko focus</title>
<style>
  :root{
    --bg:#EEF1FB;
    --ink:#0F172A;
    --muted:#64748B;
    --muted-2:#94A3B8;
    --glass:rgba(255,255,255,.55);
    --glass-strong:rgba(255,255,255,.72);
    --glass-brd:rgba(255,255,255,.75);
    --accent:#5B7CFA;
    --accent-2:#7C6CF6;
    --accent-grad:linear-gradient(135deg,#5B7CFA 0%,#7C6CF6 100%);
    --shadow:0 18px 48px -20px rgba(40,52,120,.28);
    --shadow-sm:0 10px 30px -16px rgba(40,52,120,.22);
    --radius:26px;
    --radius-sm:16px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    color:var(--ink); line-height:1.65;
    background:transparent;
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.01em;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px; border:1.5px solid rgba(148,163,184,.35); border-radius:14px; padding:13px 15px; background:rgba(255,255,255,.7); color:var(--ink); width:100%; transition:.25s var(--ease); backdrop-filter:blur(8px);}
  input::placeholder,textarea::placeholder{color:var(--muted-2);}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(91,124,250,.14); background:#fff;}

  /* ===== 电影级光影背景 ===== */
  .ambient{position:fixed; inset:0; z-index:-2; overflow:hidden; background:linear-gradient(180deg,#F6F8FE 0%,#E9EDFB 55%,#EDE9FB 100%);}
  .ambient span{position:absolute; border-radius:50%; filter:blur(90px); opacity:.55;}
  .ambient .o1{width:520px; height:520px; background:radial-gradient(circle,#AEC3FF,transparent 70%); top:-160px; left:-120px;}
  .ambient .o2{width:560px; height:560px; background:radial-gradient(circle,#D9C6FF,transparent 70%); bottom:-200px; right:-140px;}
  .ambient .o3{width:420px; height:420px; background:radial-gradient(circle,#BDECF5,transparent 70%); top:40%; left:55%; opacity:.4;}

  /* ===== 顶栏 / 导航 ===== */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,.6); backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,.7);
    padding:14px 18px 14px;
  }
  .clock-row{display:flex; align-items:center; gap:11px;}
  .clock-ico{width:20px; height:20px; flex:0 0 auto; color:var(--accent);}
  #clock{font-size:13px; letter-spacing:.4px; color:var(--muted); font-weight:500;}
  #clock b{font-size:18px; font-weight:600; color:var(--ink); letter-spacing:1px; font-variant-numeric:tabular-nums;}
  .live-dot{width:7px; height:7px; border-radius:50%; background:#34D399; box-shadow:0 0 0 4px rgba(52,211,153,.18); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .nav{display:flex; gap:10px; margin-top:13px;}
  .nav button{
    flex:1; min-height:48px; border-radius:15px; font-size:14px; font-weight:600; letter-spacing:.3px;
    background:rgba(255,255,255,.45); color:var(--muted); border:1px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center; gap:7px; transition:.3s var(--ease); backdrop-filter:blur(10px);
  }
  .nav button:hover{transform:translateY(-2px); color:var(--ink); box-shadow:var(--shadow-sm);}
  .nav button.active{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:0 12px 28px -10px rgba(91,124,250,.6);}
  .nav button svg{width:18px; height:18px;}

  /* ===== 品牌名 & 音效按钮 ===== */
  .head-row{display:flex; align-items:center; justify-content:flex-start; gap:12px;}
  .app-title{font-size:23px; font-weight:800; color:var(--ink); letter-spacing:-.01em; margin:2px 0 14px; display:flex; align-items:center; gap:8px;}
  .app-greeting{font-size:22px; font-weight:800; letter-spacing:.3px; display:inline-flex; align-items:center; margin:2px 0 14px; color:var(--ink);}
  .app-greeting .kaomoji{margin-left:10px; font-size:19px; font-weight:700; letter-spacing:0; color:var(--accent);}
  .sfx-btn{width:38px; height:38px; min-height:38px; border-radius:12px; background:rgba(255,255,255,.7); border:1px solid rgba(148,163,184,.3); font-size:18px; display:flex; align-items:center; justify-content:center; margin-left:8px; transition:.25s var(--ease); backdrop-filter:blur(8px);}
  .sfx-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-sm);}

  /* ===== 布局 ===== */
  main{max-width:940px; margin:0 auto; padding:26px 20px;}
  .view{display:none;}
  .view.active{display:block; animation:enter .5s var(--ease);}
  @keyframes enter{from{opacity:0; transform:translateY(14px) scale(.99);} to{opacity:1; transform:none;}}

  /* ===== 玻璃卡片 ===== */
  .card{
    background:var(--glass); backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--glass-brd); border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
    padding:24px; margin-bottom:20px; transition:.35s var(--ease);
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 26px 56px -22px rgba(40,52,120,.32), inset 0 1px 0 rgba(255,255,255,.7);}
  .card h2{font-size:19px; margin-bottom:18px; display:flex; align-items:center; gap:11px; letter-spacing:-.02em;}
  .card h2 .mk{width:8px; height:22px; border-radius:6px; background:var(--accent-grad); display:inline-block; box-shadow:0 4px 12px -2px rgba(91,124,250,.5);}

  /* ===== 计时器 Hero ===== */
  .timer-card{
    background:linear-gradient(155deg,rgba(91,124,250,.96),rgba(124,108,246,.92));
    backdrop-filter:blur(24px) saturate(180%); color:#fff; text-align:center; padding:42px 26px 38px;
    border-radius:32px; position:relative; overflow:hidden;
    box-shadow:0 30px 64px -22px rgba(91,124,250,.62), inset 0 1px 0 rgba(255,255,255,.4);
    border:1px solid rgba(255,255,255,.25);
  }
  .timer-card::before{content:''; position:absolute; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.4),transparent 70%); top:-150px; right:-90px; filter:blur(8px);}
  .timer-card::after{content:''; position:absolute; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(189,236,245,.45),transparent 70%); bottom:-150px; left:-80px; filter:blur(6px);}
  .timer-card h2{color:#fff; justify-content:center; position:relative; z-index:1;}
  .timer-card h2 .mk{background:rgba(255,255,255,.85); box-shadow:0 4px 12px -2px rgba(0,0,0,.2);}
  #timerSelWrap{margin-bottom:16px; position:relative; z-index:1;}
  #timerSelWrap select{background:rgba(255,255,255,.95); border:none; max-width:360px; margin:0 auto; display:block; font-weight:600; color:var(--ink); box-shadow:0 8px 24px -10px rgba(0,0,0,.25); text-align:center; text-align-last:center;}
  #timerSelWrap select option{text-align:center;}
  .timer-idle{font-size:15px; opacity:.92; margin:8px 0 4px; letter-spacing:.3px; position:relative; z-index:1;}
  .timer-task{font-size:14px; opacity:.95; margin-bottom:2px; position:relative; z-index:1; letter-spacing:.3px;}
  .timer-task b{font-size:18px; font-weight:600;}
  .tag-chip{font-size:12px; padding:3px 12px; border-radius:20px; color:#fff; font-weight:700; white-space:nowrap; display:inline-block; box-shadow:0 4px 10px -3px rgba(0,0,0,.25);}
  .paused-tag{font-size:12px; background:rgba(255,255,255,.28); padding:2px 11px; border-radius:20px; margin-left:7px; font-weight:600;}
  .pause-countdown{flex-basis:100%; width:100%; font-size:12.5px; color:#fff; background:none; border:none; padding:0; border-radius:0; margin-top:10px; font-weight:500; text-align:center; letter-spacing:.2px; text-shadow:0 1px 8px rgba(0,0,0,.18);}
  .timer-display{font-size:88px; font-weight:200; letter-spacing:2px; font-variant-numeric:tabular-nums; line-height:1.05; margin:14px 0 8px; text-shadow:0 4px 24px rgba(0,0,0,.18); position:relative; z-index:1;}
  .timer-range{font-size:15px; font-weight:500; opacity:.92; letter-spacing:.4px; margin-bottom:24px; color:#fff; font-variant-numeric:tabular-nums; position:relative; z-index:1; text-shadow:0 2px 10px rgba(0,0,0,.2);}
  .timer-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; position:relative; z-index:1;}
  .big-btn{min-height:54px; padding:0 34px; border-radius:18px; font-size:16px; font-weight:600; letter-spacing:.5px; display:inline-flex; align-items:center; gap:9px; transition:.3s var(--ease);}
  .big-btn:active{transform:scale(.95);}
  .big-btn.start{background:#fff; color:#4B5BD6; box-shadow:0 14px 30px -10px rgba(0,0,0,.3);}
  .big-btn.start:hover{transform:translateY(-2px); box-shadow:0 18px 38px -12px rgba(0,0,0,.35);}
  .big-btn.stop{background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.55); backdrop-filter:blur(8px);}
  .big-btn.stop:hover{background:rgba(255,255,255,.28);}
  .big-btn.ghost{background:rgba(255,255,255,.2); color:#fff; border:1.5px solid rgba(255,255,255,.5);}
  .big-btn.ghost:hover{background:rgba(255,255,255,.3);}
  .big-btn svg{width:20px; height:20px;}

  /* ===== 添加任务 ===== */
  .add-row{display:flex; gap:10px; margin-bottom:13px; flex-wrap:wrap;}
  .add-row input[name=task]{flex:2; min-width:150px;}
  .add-row input[name=tag]{flex:1; min-width:95px;}
  .add-row button{min-height:48px; padding:0 24px; border-radius:14px; background:var(--accent-grad); color:#fff; font-weight:600; white-space:nowrap; font-size:15px; letter-spacing:.5px; box-shadow:0 12px 26px -10px rgba(91,124,250,.6); transition:.3s var(--ease);}
  .add-row button:hover{transform:translateY(-2px); box-shadow:0 16px 32px -12px rgba(91,124,250,.7);}
  .add-row button:active{transform:scale(.96);}
  .tag-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{font-size:13px; padding:6px 15px; border-radius:22px; color:#fff; font-weight:600; transition:.25s var(--ease); box-shadow:0 6px 16px -6px rgba(0,0,0,.25);}
  .chip:hover{transform:translateY(-2px) scale(1.03);}
  .chip:active{transform:scale(.94);}

  /* ===== 任务列表 ===== */
  .task-item{display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid rgba(148,163,184,.25); border-radius:18px; margin-bottom:11px; background:rgba(255,255,255,.5); backdrop-filter:blur(10px); transition:.3s var(--ease);}
  .task-item:hover{transform:translateY(-2px); box-shadow:var(--shadow-sm); border-color:rgba(91,124,250,.3);}
  .task-item.done{opacity:.55; background:rgba(241,245,249,.6);}
  .task-item.done .tname{text-decoration:line-through;}
  .chk{width:28px; height:28px; border-radius:9px; border:2.5px solid var(--accent); flex:0 0 auto; display:flex; align-items:center; justify-content:center; transition:.2s var(--ease); cursor:pointer;}
  .task-item.done .chk{background:var(--accent-grad); border-color:transparent; box-shadow:0 6px 14px -4px rgba(91,124,250,.6);}
  .chk svg{width:16px; height:16px; stroke:#fff; display:none;}
  .task-item.done .chk svg{display:block;}
  .tname{flex:1; font-weight:600; min-width:0; font-size:15px;}
  .tname small{display:block; font-weight:500; color:var(--muted); font-size:12px; margin-top:3px; letter-spacing:.2px;}
  .badge{font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700; letter-spacing:.3px;}
  .badge.rolled{background:rgba(251,191,36,.16); color:#B45309;}
  .mini-btn{min-height:42px; padding:0 15px; border-radius:13px; font-size:13px; font-weight:600; background:var(--accent-grad); color:#fff; white-space:nowrap; transition:.25s var(--ease); box-shadow:0 8px 18px -8px rgba(91,124,250,.6);}
  .mini-btn:hover{transform:translateY(-2px);}
  .mini-btn:active{transform:scale(.94);}
  .mini-btn.ghost{background:rgba(255,255,255,.7); color:#4B5BD6; border:1px solid rgba(91,124,250,.3); box-shadow:none;}
  .mini-btn.del{background:rgba(244,113,108,.12); color:#E0504D; box-shadow:none; font-size:17px; font-weight:700; line-height:1; padding:0 14px;}
  .task-item.editing{flex-wrap:wrap; gap:9px; background:rgba(255,255,255,.8);}
  .task-item.editing input{flex:1; min-width:120px;}

  /* ===== 时间块 ===== */
  .seg{display:flex; gap:8px; margin-bottom:16px; background:rgba(241,245,249,.7); padding:5px; border-radius:16px; border:1px solid rgba(148,163,184,.2);}
  .seg button{flex:1; min-height:44px; border-radius:12px; background:transparent; color:var(--muted); font-weight:600; font-size:14px; letter-spacing:.5px; transition:.3s var(--ease);}
  .seg button.active{background:var(--accent-grad); color:#fff; box-shadow:0 10px 22px -10px rgba(91,124,250,.6);}
  .nav-date{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; font-weight:600; color:var(--ink); font-size:15px; letter-spacing:.3px;}
  .nav-date button{width:44px; height:44px; border-radius:13px; background:rgba(255,255,255,.7); color:var(--accent); font-size:20px; font-weight:700; border:1px solid rgba(148,163,184,.25); transition:.25s var(--ease);}
  .nav-date button:hover{transform:translateY(-2px); box-shadow:var(--shadow-sm);}
  .timeline{position:relative; border-left:2px solid rgba(148,163,184,.3); margin-left:50px;}
  .hr{position:absolute; left:-50px; width:44px; text-align:right; font-size:11px; color:var(--muted-2); transform:translateY(-7px); font-variant-numeric:tabular-nums;}
  .blk{position:absolute; left:6px; right:6px; border-radius:11px; padding:6px 11px; color:#fff; overflow:hidden; box-shadow:0 8px 20px -8px rgba(0,0,0,.35); backdrop-filter:blur(4px);}
  .blk .blk-t{font-size:12px; font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .blk .blk-d{font-size:11px; opacity:.92; font-weight:500;}
  .blk-tip{position:fixed; z-index:9999; left:0; top:0; pointer-events:none; padding:6px 12px; border-radius:11px; background:rgba(30,41,59,.92); color:#fff; font-size:12px; font-weight:700; letter-spacing:.3px; line-height:1.4; box-shadow:0 14px 34px -10px rgba(0,0,0,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; transform:translateY(5px) scale(.96); transition:opacity .16s var(--ease), transform .16s var(--ease); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .blk-tip.show{opacity:1; transform:translateY(0) scale(1);}
  .wk-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:7px;}
  .wk-col{background:rgba(255,255,255,.5); border:1px solid rgba(148,163,184,.22); border-radius:13px; position:relative; overflow:hidden; min-height:220px; backdrop-filter:blur(10px); transition:.3s var(--ease);}
  .wk-col:hover{transform:translateY(-2px); box-shadow:var(--shadow-sm);}
  .wk-col .wd{font-size:11px; text-align:center; padding:6px 0; color:var(--muted); font-weight:600; border-bottom:1px solid rgba(148,163,184,.2); letter-spacing:.2px;}
  .wk-col .wd b{display:block; color:var(--ink); font-size:14px; font-weight:700;}
  .wk-col .wblk{position:absolute; left:4px; right:4px; border-radius:7px; color:#fff; font-size:10px; padding:2px 5px; overflow:hidden; font-weight:600; box-shadow:0 4px 10px -4px rgba(0,0,0,.3);}
  .mo-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .mo-cell{border:1px solid rgba(148,163,184,.22); border-radius:12px; padding:7px; min-height:66px; background:rgba(255,255,255,.5); cursor:pointer; transition:.25s var(--ease); backdrop-filter:blur(8px);}
  .mo-cell:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 10px 22px -10px rgba(91,124,250,.4);}
  .mo-cell.today{border-color:var(--accent); box-shadow:0 0 0 2px rgba(91,124,250,.22); background:rgba(91,124,250,.06);}
  .mo-cell .md{font-size:13px; font-weight:700; color:var(--ink);}
  .mo-cell.empty{background:transparent; border:none; cursor:default;}
  .mo-bars{margin-top:6px; display:flex; flex-direction:column; gap:3px;}
  .mo-bar{height:5px; border-radius:3px;}
  .empty-hint{color:var(--muted); font-size:14px; text-align:center; padding:36px 0; letter-spacing:.3px;}

  /* ===== 进度看板 ===== */
  .board-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  .tag-card{border:1px solid rgba(148,163,184,.22); border-radius:20px; padding:18px; background:rgba(255,255,255,.55); backdrop-filter:blur(14px); box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.6); transition:.3s var(--ease);}
  .tag-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .tag-head{display:flex; align-items:center; gap:11px; margin-bottom:12px;}
  .tag-head .tag-chip{font-size:13px; padding:5px 14px;}
  .tag-stat{margin-left:auto; text-align:right; font-size:13px; color:var(--muted); font-weight:600;}
  .tag-stat b{display:block; font-size:24px; color:var(--ink); font-weight:700; letter-spacing:-.02em;}
  .tag-list .li{display:flex; justify-content:space-between; padding:9px 0; border-top:1px dashed rgba(148,163,184,.3); font-size:14px; gap:10px; color:var(--ink);}
  .tag-list .li span:last-child{color:var(--muted); white-space:nowrap; font-weight:600; font-variant-numeric:tabular-nums;}

  /* ===== 周报 ===== */
  .bar-chart{display:flex; align-items:flex-end; gap:10px; height:200px; padding:14px 0 0; border-bottom:2.5px solid rgba(148,163,184,.25);}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar{width:70%; border-radius:9px 9px 0 0; min-height:3px; transition:.4s var(--ease); box-shadow:0 8px 18px -8px rgba(91,124,250,.5);}
  .bar-col .bv{font-size:11px; color:var(--muted); margin-bottom:6px; font-weight:600; font-variant-numeric:tabular-nums;}
  .bar-col .bl{font-size:11px; color:var(--ink); margin-top:9px; font-weight:600;}
  .ring-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .legend{display:flex; flex-direction:column; gap:9px; font-size:13px; flex:1; min-width:160px; font-weight:600;}
  .legend .lg{display:flex; align-items:center; gap:10px; color:var(--ink);}
  .legend .sw{width:14px; height:14px; border-radius:5px; box-shadow:0 3px 8px -2px rgba(0,0,0,.25);}
  .streak{display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,rgba(255,243,224,.85),rgba(255,233,199,.7)); border:1px solid rgba(246,220,168,.6); border-radius:18px; padding:16px 18px; margin-bottom:16px; backdrop-filter:blur(10px);}
  .streak svg{width:36px; height:36px; filter:drop-shadow(0 4px 8px rgba(224,138,30,.4));}
  .streak b{font-size:26px; color:#E08A1E; font-weight:700;}
  .summary{width:100%; min-height:84px; resize:vertical; margin-top:6px; border:1px solid rgba(148,163,184,.3); border-radius:14px; padding:13px 15px; font-size:15px; line-height:1.7; background:rgba(255,255,255,.7);}
  .auto-note{font-size:12px; color:var(--muted-2); margin-top:7px;}
  .week-nav{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; padding:12px 14px; background:rgba(255,255,255,.55); border:1px solid rgba(148,163,184,.2); border-radius:18px; backdrop-filter:blur(12px); box-shadow:0 10px 30px -18px rgba(91,124,250,.5);}
  .wk-btn{font-size:13.5px; font-weight:600; color:var(--ink); background:rgba(255,255,255,.85); border:1px solid rgba(148,163,184,.3); border-radius:12px; padding:9px 14px; cursor:pointer; transition:.25s ease; min-height:42px;}
  .wk-btn:hover:not(:disabled){background:#fff; box-shadow:0 6px 16px -8px rgba(91,124,250,.6); transform:translateY(-1px);}
  .wk-btn:disabled{opacity:.4; cursor:not-allowed;}
  .wk-btn.wk-today{background:linear-gradient(135deg,#7C6CF6,#5B7CFA); color:#fff; border:none;}
  .wk-label{font-size:15px; font-weight:700; color:var(--ink); white-space:nowrap; min-width:210px; text-align:center;}
  .regen-btn{margin-top:10px; font-size:13px; font-weight:600; color:#5B7CFA; background:rgba(91,124,250,.1); border:1px solid rgba(91,124,250,.3); border-radius:11px; padding:8px 14px; cursor:pointer; transition:.25s ease;}
  .regen-btn:hover{background:rgba(91,124,250,.18);}

  /* ===== 备份 ===== */
  .backup{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .backup span{font-size:13px;color:var(--muted);font-weight:600; margin-right:4px;}
  .backup button{min-height:46px; padding:0 19px; border-radius:14px; font-weight:600; font-size:14px; letter-spacing:.3px; transition:.3s var(--ease);}
  .backup button:hover{transform:translateY(-2px);}
  .backup .exp{background:var(--accent-grad); color:#fff; box-shadow:0 12px 26px -10px rgba(91,124,250,.6);}
  .backup .imp{background:rgba(255,255,255,.7); color:#4B5BD6; border:1px solid rgba(91,124,250,.3);}
  .backup .clr{background:rgba(244,113,108,.12); color:#E0504D; margin-left:auto;}
  .warn-banner{background:rgba(255,246,224,.9); border:1px solid rgba(246,224,168,.7); color:#B07A1E; border-radius:16px; padding:13px 17px; font-size:13px; margin-bottom:18px; display:none; font-weight:600; backdrop-filter:blur(10px);}

  /* ===== 数据模式 ===== */
  .mode-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:13px;}
  .mode-label{font-size:14px; color:var(--muted); font-weight:600;}
  .mode-label b{color:var(--ink); font-weight:700;}
  .mode-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .mode-btn{min-height:42px; padding:0 16px; border-radius:13px; font-size:13px; font-weight:600; background:rgba(255,255,255,.7); color:var(--muted); border:1px solid rgba(148,163,184,.3); transition:.25s var(--ease);}
  .mode-btn:hover{transform:translateY(-2px);}
  .mode-btn.active{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:0 10px 22px -10px rgba(91,124,250,.6);}
  .mode-btn.danger{background:rgba(244,113,108,.12); color:#E0504D; border-color:rgba(244,113,108,.3);}
  .mode-tip{font-size:12.5px; color:var(--muted-2); line-height:1.65; margin:0;}

  /* ===== 手动补卡 ===== */
  .bf-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
  .bf-field{display:flex; flex-direction:column; gap:6px;}
  .bf-field label{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.2px;}
  .bf-field.bf-wide{grid-column:1 / -1;}
  .bf-check{display:flex; align-items:center; gap:9px; font-size:14px; color:var(--ink); font-weight:500; margin-bottom:14px; cursor:pointer;}
  .bf-check input{width:18px; height:18px; accent-color:var(--accent); flex:0 0 auto;}
  .bf-add{min-height:50px; width:100%; border-radius:15px; background:var(--accent-grad); color:#fff; font-weight:600; font-size:15px; letter-spacing:.5px; box-shadow:0 12px 26px -10px rgba(91,124,250,.6); transition:.3s var(--ease);}
  .bf-add:hover{transform:translateY(-2px);}
  .bf-add:active{transform:scale(.98);}
  @media (max-width:768px){ .bf-grid{grid-template-columns:repeat(2,1fr);} }

  /* ===== Toast ===== */
  #toast{position:fixed; left:50%; top:22px; transform:translateX(-50%) translateY(-16px); background:rgba(15,23,42,.9); backdrop-filter:blur(12px); color:#fff; padding:12px 22px; border-radius:26px; font-size:14px; z-index:99; opacity:0; transition:.35s var(--ease); pointer-events:none; font-weight:600; box-shadow:0 16px 40px -12px rgba(0,0,0,.5);}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== 底部移动导航 ===== */
  .bottom-nav{display:none;}
  @media (max-width:768px){
    main{padding:18px 15px;}
    .nav{display:none;}
    header{padding-bottom:12px;}
    .timer-display{font-size:56px; letter-spacing:1px; margin-bottom:6px;}
    .timer-range{font-size:13px; margin-bottom:18px;}
    .head-row{flex-wrap:wrap;}
    .board-grid{grid-template-columns:1fr;}
    .bottom-nav{display:flex; position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.7); backdrop-filter:blur(24px) saturate(180%); box-shadow:0 -4px 20px rgba(40,52,120,.12); z-index:40; padding:9px 6px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.7);}
    .bottom-nav button{flex:1; min-height:52px; border-radius:15px; color:var(--muted); font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:.25s var(--ease);}
    .bottom-nav button.active{color:#4B5BD6; background:rgba(91,124,250,.1);}
    .bottom-nav button svg{width:23px; height:23px;}
  }
  @media (min-width:769px) and (max-width:900px){
    .board-grid{grid-template-columns:1fr;}
  }

  /* ===== 鼠标跟随柔光（电影级光影） ===== */
  .cursor-glow{
    position:fixed; top:0; left:0;
    width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle,
      rgba(91,124,250,var(--glow-a,.30)) 0%,
      rgba(124,108,246,var(--glow-b,.18)) 34%,
      transparent 68%);
    pointer-events:none; z-index:-1;
    will-change:transform;
    transform:translate(var(--gx,-260px),var(--gy,-260px));
    animation:glowBreath 2.6s ease-in-out infinite;
    filter:blur(2px);
  }
  @keyframes glowBreath{
    0%,100%{transform:translate(var(--gx,-260px),var(--gy,-260px)) scale(1); opacity:.7;}
    50%{transform:translate(var(--gx,-260px),var(--gy,-260px)) scale(1.15); opacity:.95;}
  }

  /* ===== 小猫模式（右击进入，指针🐱，点哪炸哪；密度/样子参照自我介绍页） ===== */
  .pinch-overlay{position:fixed; inset:0; z-index:9000; background:rgba(238,241,251,.04); cursor:none;}
  .fs-hint{
    position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:9100;
    background:rgba(255,255,255,.85); color:var(--accent);
    font-size:13px; font-weight:700; padding:8px 16px; border-radius:999px;
    box-shadow:0 4px 14px rgba(91,124,250,.3); pointer-events:none; backdrop-filter:blur(8px);
  }
  .fs-exit{
    position:fixed; top:16px; right:18px; z-index:9100;
    border:none; background:rgba(255,255,255,.92); color:var(--accent);
    font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px;
    cursor:pointer; box-shadow:0 4px 14px rgba(91,124,250,.3);
  }
  .fs-exit:hover{background:#fff;}
  .pinch-burst{position:fixed; width:0; height:0; pointer-events:none; z-index:9500;}
  .pinch-cursor-cat{
    position:fixed; left:0; top:0; font-size:45px; pointer-events:none;
    z-index:9600; user-select:none; transition:transform .04s linear;
    filter:drop-shadow(0 2px 4px rgba(169,207,210,.35));
  }
  .pinch-fly{
    position:absolute; left:50%; top:50%; font-size:32px; pointer-events:none;
    transform:translate(-50%,-50%); animation:flyOut .75s ease-out forwards; z-index:5;
  }
  @keyframes flyOut{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
    25%{opacity:1;}
    100%{opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot));}
  }
  .pinch-fly.fixed{position:fixed; font-size:35px;}

  /* ===== 右下角光晕浓淡滑块 ===== */
  .glow-ctrl{
    position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:60; display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-radius:18px;
    background:rgba(255,255,255,.55); backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 12px 34px -16px rgba(40,52,120,.4);
    font-size:12px; color:var(--ink); font-weight:600; user-select:none;
  }
  .glow-ctrl-label{white-space:nowrap; opacity:.85;}
  .glow-ctrl input[type=range]{
    -webkit-appearance:none; appearance:none; width:120px; height:6px; border-radius:6px;
    background:var(--accent-grad); outline:none; cursor:pointer; border:none; padding:0;
  }
  .glow-ctrl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; border:2px solid var(--accent); box-shadow:0 2px 8px rgba(40,52,120,.35);
  }
  .glow-ctrl input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid var(--accent); box-shadow:0 2px 8px rgba(40,52,120,.35);
  }
  @media (max-width:768px){
    .glow-ctrl{right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); padding:8px 11px;}
    .glow-ctrl input[type=range]{width:88px;}
  }

  /* ===== 子标签输入 ===== */
  .add-row input[name=subtag]{flex:1; min-width:95px;}

  /* ===== 归档任务（折叠） ===== */
  .archive-wrap{margin-top:16px; border-top:1px dashed rgba(148,163,184,.35); padding-top:14px;}
  .archive-toggle{display:flex; align-items:center; gap:8px; width:100%; min-height:46px; border-radius:14px; background:rgba(241,245,249,.7); border:1px solid rgba(148,163,184,.25); font-weight:700; font-size:14px; color:var(--ink); padding:0 14px; transition:.25s var(--ease);}
  .archive-toggle:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm);}
  .archive-toggle .tri{width:16px; height:16px; transition:transform .25s var(--ease); color:var(--accent);}
  .archive-toggle.open .tri{transform:rotate(90deg);}
  .archive-count{margin-left:auto; font-size:12px; color:var(--muted); background:rgba(148,163,184,.18); padding:2px 10px; border-radius:20px; font-weight:700;}
  .archive-list{margin-top:12px;}
  .archive-list .task-item.done{opacity:.78;}

  /* ===== 目标思维导图 ===== */
  .mm-toggle{display:flex; gap:8px; margin-bottom:16px; background:rgba(241,245,249,.7); padding:5px; border-radius:16px; border:1px solid rgba(148,163,184,.2);}
  .mm-toggle button{flex:1; min-height:44px; border-radius:12px; background:transparent; color:var(--muted); font-weight:600; font-size:14px; transition:.3s var(--ease);}
  .mm-toggle button.active{background:var(--accent-grad); color:#fff; box-shadow:0 10px 22px -10px rgba(91,124,250,.6);}
  .mm-range{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px; padding:10px 12px; border-radius:16px; background:rgba(241,245,249,.7); border:1px solid rgba(148,163,184,.2);}
  .mm-datebtn{flex:1; min-width:132px; min-height:44px; font-size:14px; font-weight:600; padding:0 12px; border-radius:12px; border:1px solid rgba(148,163,184,.3); background:rgba(255,255,255,.9); color:var(--ink); font-family:inherit; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; transition:.2s var(--ease);}
  .mm-datebtn:hover{border-color:var(--accent); color:var(--accent);}
  .mm-datebtn.empty{color:var(--muted-2); font-weight:500;}
  .mm-sep{color:var(--muted); font-weight:700;}
  .mm-expand{display:flex; align-items:center; gap:10px; margin:0 0 6px;}
  .mm-tri{display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:0 14px; border-radius:12px; background:rgba(241,245,249,.55); border:1px solid rgba(148,163,184,.18); color:var(--muted); font-weight:600; font-size:13px; transition:.25s var(--ease);}
  .mm-tri:hover{background:rgba(91,124,250,.12); color:#4B5BD6; border-color:rgba(91,124,250,.3);}
  .mm-tri .tri{display:inline-block; font-size:10px; line-height:1; transition:transform .25s var(--ease); transform:rotate(-90deg);}
  .mm-tri.open{background:rgba(91,124,250,.14); color:#4B5BD6; box-shadow:inset 0 0 0 1px rgba(91,124,250,.28);}
  .mm-tri.open .tri{transform:rotate(0deg);}
  .mm-lev-tip{font-size:12px; color:var(--muted-2); margin:0 0 14px; padding-left:4px;}
  .empty-demo{margin-top:10px;}
  .empty-demo .mini-btn{min-height:40px;}
  @media(max-width:520px){.mm-toggle{flex-wrap:wrap;} .mm-toggle button{flex:1 1 40%;} .mm-range{gap:8px;} .mm-datebtn{min-width:0; flex:1 1 40%;}}
  .mm-tree{list-style:none; margin:4px 0 0; padding:0; font-size:14px;}
  .mm-tree ul{list-style:none; margin:0; padding-left:20px; border-left:2px solid rgba(148,163,184,.28);}
  .mm-tree>li{padding-left:0;}
  .mm-tree li{position:relative; padding:4px 0 4px 16px;}
  .mm-tree li::before{content:''; position:absolute; left:0; top:18px; width:14px; height:2px; background:rgba(148,163,184,.32);}
  .mm-tree>li::before{display:none;}
  .mm-root,.mm-tagnode,.mm-subnode,.mm-leaf{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:12px;}
  .mm-root{background:var(--accent-grad); color:#fff; font-weight:800; font-size:15px; box-shadow:0 8px 20px -10px rgba(91,124,250,.6);}
  .mm-tagnode{background:rgba(255,255,255,.75); border:1px solid rgba(148,163,184,.3); font-weight:700;}
  .mm-tname{font-weight:700;}
  .mm-frac{font-size:12px; color:var(--muted); font-weight:700; margin-left:2px;}
  .mm-subnode{background:rgba(124,108,246,.1); color:#5B4BD6; font-weight:700; font-size:13px;}
  .mm-leaf{background:rgba(255,255,255,.5); border:1px solid rgba(148,163,184,.22); font-weight:600; font-size:13px;}
  .mm-leaf.done{background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.4); color:#0F766E;}
  .mm-done{color:#0E9F6E; font-size:12px; font-weight:700;}
  .mm-pend{color:var(--muted-2); font-size:12px;}
  /* 长期目标面板 */
  .mm-layout{display:flex; gap:20px; align-items:flex-start; margin-top:4px;}
  #mindmap{flex:1 1 auto; min-width:0;}
  .lg-panel{flex:0 0 320px; max-width:320px; background:rgba(241,245,249,.55); border:1px solid rgba(148,163,184,.2); border-radius:18px; padding:16px; align-self:stretch;}
  .lg-title{margin:0 0 12px; font-size:16px; font-weight:800; color:var(--ink);}
  .lg-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .lg-days{font-size:12px; font-weight:700; color:#4B5BD6; background:rgba(91,124,250,.12); padding:2px 8px; border-radius:8px; white-space:nowrap;}
  .lg-days.overdue{color:#DC2626; background:rgba(248,113,113,.14);}
  .lg-grip{cursor:grab; user-select:none; display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:8px; color:var(--muted-2); background:rgba(148,163,184,.12); font-size:14px; line-height:1; flex:0 0 auto; transition:.2s var(--ease);}
  .lg-grip:hover{background:rgba(91,124,250,.16); color:#4B5BD6;}
  .lg-grip:active{cursor:grabbing;}
  .lg-item.dragging{opacity:.45;}
  .lg-item.drag-over{box-shadow:0 0 0 2px var(--accent) inset; border-radius:12px;}
  .lg-add{display:flex; flex-direction:column; gap:8px; margin-top:14px; padding-top:14px; border-top:1px dashed rgba(148,163,184,.3);}
  .lg-input{min-height:42px; font-size:16px; padding:0 12px; border-radius:12px; border:1px solid rgba(148,163,184,.3); background:rgba(255,255,255,.92); color:var(--ink); font-family:inherit; width:100%; box-sizing:border-box;}
  .lg-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,124,250,.15);}
  .lg-add-row{display:flex; gap:8px;}
  .lg-add-row .lg-input{flex:1; min-width:0;}
  .lg-add-btn{min-height:44px; border-radius:12px; border:none; background:var(--accent-grad); color:#fff; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 10px 22px -10px rgba(91,124,250,.6);}
  .lg-add-btn:hover{filter:brightness(1.05);}
  .lg-list{display:flex; flex-direction:column; gap:10px;}
  .lg-item{background:rgba(255,255,255,.8); border:1px solid rgba(148,163,184,.22); border-radius:14px; padding:12px;}
  .lg-item.done{background:rgba(52,211,153,.1); border-color:rgba(52,211,153,.35);}
  .lg-item-top{display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .lg-item-top .lg-name{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lg-name{font-weight:700; font-size:14px; color:var(--ink); word-break:break-word;}
  .lg-meta{margin:8px 0 6px;}
  .lg-deadline{font-size:12px; font-weight:600; color:var(--muted);}
  .lg-deadline.overdue{color:#E0504D; font-weight:700;}
  .lg-btns{display:flex; gap:6px; margin-top:8px;}
  .lg-btns .mini-btn{flex:1; min-height:38px; font-size:13px;}
  .lg-done-note{font-size:12px; font-weight:700; color:#0E9F6E; margin:6px 0 4px;}
  .lg-note-input{min-height:36px; font-size:13px; padding:0 10px; border-radius:10px; border:1px solid rgba(148,163,184,.28); background:rgba(255,255,255,.9); width:100%; box-sizing:border-box; font-family:inherit; color:var(--ink);}
  .lg-archive{margin-top:14px; border-top:1px dashed rgba(148,163,184,.3); padding-top:12px;}
  .lg-arch-toggle{width:100%; min-height:40px; border-radius:12px; border:1px solid rgba(148,163,184,.25); background:rgba(255,255,255,.7); font-weight:700; font-size:13px; color:var(--muted); cursor:pointer; font-family:inherit;}
  .lg-arch-toggle:hover{background:#fff;}
  .lg-arch-list{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .lg-item.editing{background:rgba(255,255,255,.96); border-color:rgba(91,124,250,.5); box-shadow:0 0 0 3px rgba(91,124,250,.12);}
  .lg-edit-name{font-weight:700; font-size:14px; margin-bottom:8px;}
  .lg-edit-row{display:flex; gap:8px; margin-bottom:8px;}
  .lg-edit-row .lg-input{flex:1; min-width:0;}
  .mini-btn.save{background:var(--accent-grad); color:#fff;}
  @media(max-width:768px){ .mm-layout{flex-direction:column;} .lg-panel{flex:1 1 auto; max-width:none; width:100%;} }

  /* ===== 周报日历弹窗 ===== */
  .cal-pop{position:fixed; inset:0; z-index:80; background:rgba(15,23,42,.28); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px;}
  .cal-box{background:rgba(255,255,255,.94); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.8); border-radius:22px; padding:18px; width:330px; max-width:92vw; box-shadow:0 30px 70px -20px rgba(40,52,120,.5);}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; font-weight:700; font-size:15px;}
  .cal-head button{width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.8); border:1px solid rgba(148,163,184,.3); font-size:18px; font-weight:700; color:var(--accent);}
  .cal-head button:hover{background:#fff;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-wd{text-align:center; font-size:11px; color:var(--muted-2); font-weight:700; padding:3px 0;}
  .cal-cell{position:relative; text-align:center; padding:9px 0; border-radius:11px; font-size:14px; font-weight:600; cursor:pointer; background:rgba(255,255,255,.5); border:1px solid transparent; transition:.2s var(--ease);}
  .cal-cell:hover{border-color:var(--accent); transform:translateY(-1px);}
  .cal-cell.empty{background:transparent; cursor:default;}
  .cal-cell.today{border-color:var(--accent); color:var(--accent); background:rgba(91,124,250,.1);}
  .cal-cell.curweek{background:rgba(124,108,246,.16); color:#4B3DB6;}
  .cal-cell.curweek.today{background:rgba(91,124,250,.22);}
  .cal-dot{position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--accent);}
  .cal-cell.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cal-cell.inrange{background:rgba(124,108,246,.2); color:#4B3DB6;}
  .cal-cell.sel.today{background:var(--accent); color:#fff;}
  .cal-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:10px; border-top:1px dashed rgba(148,163,184,.3); font-size:12px; font-weight:600; color:var(--muted);}
</style>
</head>
<body>

<div class="ambient"><span class="o1"></span><span class="o2"></span><span class="o3"></span></div>

<header>
  <div class="head-row">
    <div class="clock-row">
      <span class="live-dot"></span>
      <svg class="clock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div id="clock">加载中…</div>
      <button id="sfxBtn" class="sfx-btn" aria-label="音效开关" title="音效开关">🔊</button>
    </div>
  </div>
  <nav class="nav" id="topNav">
    <button data-view="today" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>今日任务
    </button>
    <button data-view="board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>进度看板
    </button>
    <button data-view="weekly">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v4h-4"/></svg>周报复盘
    </button>
  </nav>
</header>

<main>
  <div class="app-greeting" id="greeting"></div>
  <div class="warn-banner" id="warnBanner"></div>

  <!-- ① 今日 -->
  <section class="view active" id="view-today">
    <!-- 计时器（最上面） -->
    <div class="card timer-card">
      <h2><span class="mk"></span>专注计时</h2>
      <div id="timerSelWrap">
        <select id="timerSel"></select>
      </div>
      <div id="timerBody"></div>
      <div class="timer-actions" id="timerBtns"></div>
    </div>

    <!-- 今日任务清单 -->
    <div class="card">
      <h2><span class="mk"></span>今日任务清单</h2>
      <div class="add-row">
        <input name="task" id="taskInput" placeholder="任务名，如：编程·写页面">
        <input name="tag" id="tagInput" list="tagList" placeholder="标签，如：cs学习">
        <input name="subtag" id="subtagInput" list="subtagList" placeholder="子标签（可选）如：Python">
        <datalist id="tagList"></datalist>
        <datalist id="subtagList"></datalist>
        <button id="addTaskBtn">添加</button>
      </div>
      <div class="tag-chips" id="tagChips"></div>
      <div id="taskList"></div>
      <div class="archive-wrap" id="archiveWrap">
        <button class="archive-toggle" id="archiveToggle">
          <svg class="tri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
          归档任务 <span class="archive-count" id="archiveCount">(0)</span>
        </button>
        <div class="archive-list" id="archiveList" style="display:none;"></div>
      </div>
    </div>

    <!-- 时间块预览 -->
    <div class="card">
      <h2><span class="mk"></span>时间块预览</h2>
      <div class="seg" id="blkSeg">
        <button data-bv="day" class="active">日</button>
        <button data-bv="week">周</button>
        <button data-bv="month">月</button>
      </div>
      <div class="nav-date">
        <button id="blkPrev">‹</button>
        <span id="blkLabel"></span>
        <button id="blkNext">›</button>
      </div>
      <div id="timeBlocks"></div>
      <div class="blk-tip" id="blkTip"></div>
    </div>

    <!-- 手动补卡 -->
    <div class="card">
      <h2><span class="mk"></span>手动补卡 · 补记时间</h2>
      <div class="bf-grid">
        <div class="bf-field"><label>日期</label><input type="date" id="bfDate"></div>
        <div class="bf-field"><label>开始时间</label><input type="time" id="bfStart"></div>
        <div class="bf-field"><label>时长（分钟）</label><input type="number" id="bfDur" min="1" placeholder="如 90"></div>
        <div class="bf-field bf-wide"><label>任务名</label><input type="text" id="bfName" placeholder="如：编程·写页面"></div>
        <div class="bf-field"><label>标签</label><input type="text" id="bfTag" list="tagList" placeholder="如：学习"></div>
      </div>
      <label class="bf-check"><input type="checkbox" id="bfAddTask"> 同时添加到今日任务清单</label>
      <button class="bf-add" id="bfAddBtn">添加补卡记录</button>
    </div>
  </section>

  <!-- ② 进度看板 -->
  <section class="view" id="view-board">
    <div class="card">
      <h2><span class="mk"></span>💎 目标思维导图</h2>
      <div class="mm-toggle" id="mmToggle">
        <button data-scope="all" class="active" onclick="setMM('all')">总目标</button>
        <button data-scope="week" onclick="setMM('week')">本周</button>
        <button data-scope="month" onclick="setMM('month')">本月</button>
        <button data-scope="custom" onclick="setMM('custom')">自定义</button>
      </div>
      <div class="mm-expand">
        <button class="mm-tri open" id="mmTriBtn" onclick="toggleMM()" aria-expanded="true"><span class="tri">▼</span><span id="mmTriText">展开全部</span></button>
      </div>
      <div class="mm-lev-tip" id="mmLevTip"></div>
      <div class="mm-range" id="mmRange" style="display:none">
        <button class="mm-datebtn empty" id="mmFromBtn" onclick="openDateCal('from')">📅 开始日期</button>
        <span class="mm-sep">→</span>
        <button class="mm-datebtn empty" id="mmToBtn" onclick="openDateCal('to')">📅 结束日期</button>
        <button class="mini-btn" onclick="resetMMRange()">近 7 天</button>
      </div>
      <div class="mm-layout">
        <div id="mindmap"></div>
        <aside class="lg-panel">
          <h3 class="lg-title">🎯 长期目标</h3>
          <datalist id="lgTagList"></datalist>
          <div class="lg-list" id="lgList"></div>
          <div class="lg-archive">
            <button class="lg-arch-toggle" onclick="toggleLGArchive()">📦 已完成 (<span id="lgArchCount">0</span>)</button>
            <div class="lg-arch-list" id="lgArchList"></div>
          </div>
          <div class="lg-add">
            <input id="lgName" class="lg-input" placeholder="输入长期目标…">
            <div class="lg-add-row">
              <input id="lgTag" class="lg-input" list="lgTagList" placeholder="标签">
              <input id="lgDeadline" class="lg-input" type="date">
            </div>
            <button class="lg-add-btn" onclick="addLongGoal()">+ 添加目标</button>
          </div>
        </aside>
      </div>
    </div>
    <div class="card">
      <h2><span class="mk"></span>标签进度总览</h2>
      <div class="board-grid" id="boardTags"></div>
    </div>
    <div class="card">
      <h2><span class="mk"></span>数据模式</h2>
      <div class="mode-row">
        <span class="mode-label">当前：<b id="modeLabel">示例数据</b></span>
        <div class="mode-btns">
          <button class="mode-btn" id="toRealBtn">我的数据</button>
          <button class="mode-btn" id="toDemoBtn">示例预览</button>
          <button class="mode-btn danger" id="clearDemoBtn">清空示例数据</button>
        </div>
      </div>
      <p class="mode-tip">示例数据仅用于预览效果，与「我的数据」各自独立保存，互相不覆盖。<b>每次打开或刷新页面都会回到「我的数据」</b>；想看效果点「示例预览」，关掉再开又回到你自己的数据。</p>
    </div>
    <div class="card">
      <h2><span class="mk"></span>数据备份</h2>
      <div class="backup">
        <button class="exp" id="expBtn">导出 JSON</button>
        <button class="imp" id="impBtn">导入恢复</button>
        <button class="clr" id="clrBtn">清空当前数据</button>
        <input type="file" id="impFile" accept="application/json" style="display:none">
      </div>
    </div>
  </section>

  <!-- ③ 周报复盘 -->
  <section class="view" id="view-weekly">
    <div class="week-nav">
      <button class="wk-btn" id="weekPrev">← 上一周</button>
      <div class="wk-label" id="weekLabel">本周</div>
      <button class="wk-btn" id="weekNext" disabled>下一周 →</button>
      <button class="wk-btn" id="weekCalBtn">📅 选日期</button>
      <button class="wk-btn wk-today" id="weekToday">回到本周</button>
    </div>
    <div class="cal-pop" id="weekCal" onclick="if(event.target===this)closeWeekCal()">
      <div class="cal-box" id="calBox"></div>
    </div>
    <div class="cal-pop" id="datePop" onclick="if(event.target===this)closeDateCal()">
      <div class="cal-box" id="dateBox"></div>
    </div>
    <div class="card">
      <h2><span class="mk"></span>本周每日专注时长</h2>
      <div class="bar-chart" id="weekBars"></div>
    </div>
    <div class="card">
      <h2><span class="mk"></span>各标签时长占比</h2>
      <div class="ring-wrap">
        <svg id="weekRing" width="170" height="170" viewBox="0 0 170 170"></svg>
        <div class="legend" id="weekLegend"></div>
      </div>
    </div>
    <div class="card">
      <h2><span class="mk"></span>连续打卡</h2>
      <div class="streak">
        <svg viewBox="0 0 24 24" fill="#F0913A"><path d="M12 2c1 3-1 4-1 6 0 1 1 2 2 2 2 0 3-2 3-4 2 2 3 4 3 7a7 7 0 1 1-14 0c0-4 3-6 4-9 1 2 2 2 3 0 1-3 0-5 0-7z"/></svg>
        <div>已连续打卡 <b id="streakNum">0</b> 天</div>
      </div>
    </div>
    <div class="card">
      <h2><span class="mk"></span>本周总结</h2>
      <textarea class="summary" id="weekSummary" placeholder="自动生成的总结，可手动修改…"></textarea>
      <div class="auto-note" id="autoNote"></div>
      <button class="regen-btn" id="regenNote" style="display:none;">↻ 重新生成总结</button>
    </div>
  </section>
</main>

<nav class="bottom-nav" id="bottomNav">
  <button data-view="today" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>今日任务
  </button>
