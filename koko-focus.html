<script>
"use strict";
/* ============ 数据层 ============ */
const K_REAL="wb_focusdesk_state";
const K_DEMO="wb_focusdesk_demo";
const K_MODE="wb_focusdesk_mode";
const TAG_COLORS={'cs学习':'#5B7CFA','雅思':'#A78BFA','健身':'#F87171','学习':'#5B7CFA','编程':'#22C3A6','画画':'#FB923C','阅读':'#A78BFA'};
function tagColor(t){return TAG_COLORS[t]||'#38BDF8';}

function defaultState(){
  const today=ymd(new Date());
  const yest=ymd(addDays(new Date(),-1));
  const d2=ymd(addDays(new Date(),-2));
  const d3=ymd(addDays(new Date(),-3));
  return {
    tasks:[
      {id:uid(),name:'完成 Python 函数练习',tag:'cs学习',subtag:'Python',done:true,date:d2,completedAt:d2},
      {id:uid(),name:'复习 C 语言指针',tag:'cs学习',subtag:'C语言',done:false,date:today},
      {id:uid(),name:'整理雅思听力笔记',tag:'雅思',subtag:'听力',done:false,date:today},
      {id:uid(),name:'阅读设计文章',tag:'雅思',subtag:'阅读',done:true,date:today,completedAt:today},
      {id:uid(),name:'夜跑 3 公里',tag:'健身',subtag:'跑步',done:false,date:today}
    ],
    sessions:[
      mkSession('cs学习·精听练习','cs学习',d3+'T09:00:00',5400000),
      mkSession('cs学习·写代码','cs学习',d3+'T14:00:00',7200000),
      mkSession('雅思·背单词','雅思',yest+'T10:00:00',3600000),
      mkSession('健身·夜跑','健身',yest+'T20:00:00',3600000),
      mkSession('cs学习·上午专注','cs学习',today+'T09:00:00',2700000)
    ],
    timer:null,
    weeklyNotes:{},
    selectedDate:today,
    blkView:'day',
    longGoals:[
      {id:uid(),name:'雅思总分冲 7.0',tag:'雅思',deadline:ymd(addDays(new Date(),15)),note:'',done:false,completedAt:''},
      {id:uid(),name:'读完《设计心理学》',tag:'阅读',deadline:ymd(addDays(new Date(),-5)),note:'',done:false,completedAt:''}
    ]
  };
}
function mkSession(name,tag,iso,dur){
  const s=new Date(iso); const e=new Date(s.getTime()+dur);
  return {id:uid(),taskName:name,tag:tag,start:iso,end:e.toISOString(),durationMs:dur,date:ymd(s)};
}
function emptyRealState(){ return {tasks:[],sessions:[],timer:null,weeklyNotes:{},selectedDate:ymd(new Date()),blkView:'day',longGoals:[]}; }

let modeOverride='real';
function getMode(){ return modeOverride; }
function setMode(m){ modeOverride=m; }
function activeKey(){ return getMode()==='demo'?K_DEMO:K_REAL; }
function normalize(s){
  if(!s.tasks) s.tasks=[]; if(!s.sessions) s.sessions=[];
  if(!s.timer) s.timer=null; if(!s.selectedDate) s.selectedDate=ymd(new Date());
  if(!s.blkView) s.blkView='day';
  if(!s.longGoals) s.longGoals=[];
  if(!s.weeklyNotes) s.weeklyNotes={};
  s.tasks.forEach(t=>{
    if(t.subtag===undefined||t.subtag===null) t.subtag='';
    if(t.pinned===undefined) t.pinned=false;
    if(t.done && !t.completedAt) t.completedAt=t.date||'';
  });
  s.longGoals.forEach(g=>{
    if(g.note===undefined) g.note='';
    if(g.done===undefined) g.done=false;
    if(g.completedAt===undefined) g.completedAt='';
  });
  if(s.weeklyNote!==undefined){
    if(s.weeklyNote && !s.weeklyNotes[ymd(weekStart(new Date()))]) s.weeklyNotes[ymd(weekStart(new Date()))]=s.weeklyNote;
    delete s.weeklyNote;
  }
  return s;
}

let state=loadState();
let editId=null;
let weekOffset=0;
function loadState(){
  const key=activeKey();
  const raw=localStorage.getItem(key);
  if(!raw){
    if(getMode()==='demo'){ const s=normalize(defaultState()); saveState(s); return s; }
    return normalize(emptyRealState());
  }
  try{ return normalize(JSON.parse(raw)); }
  catch(e){ return getMode()==='demo'?normalize(defaultState()):normalize(emptyRealState()); }
}
function saveState(s){
  const obj=(s===undefined)?state:s;
  localStorage.setItem(activeKey(), JSON.stringify(obj));
}

/* ============ 日期工具 ============ */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYMD(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function fmtDur(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=s%60;return pad(h)+':'+pad(m)+':'+pad(sec);}
function fmtHMS(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=s%60;return pad(h)+':'+pad(m)+':'+pad(sec);}
function fmtHM(ms){const h=Math.floor(ms/3600000);const m=Math.floor((ms%3600000)/60000);return pad(h)+':'+pad(m);}
function fmtHm(ms){const h=Math.floor(ms/3600000);const m=Math.round((ms%3600000)/60000);return h+'时'+m+'分';}
function fmtHMshort(ms){const h=Math.floor(ms/3600000);const m=Math.floor((ms%3600000)/60000);return (h>0?h+'h':'')+m+'m';}

/* ============ 计算层 ============ */
function getTasks(){return state.tasks;}
function getSessions(){return state.sessions;}
function getTags(){const t={};state.sessions.forEach(s=>{t[s.tag]=(t[s.tag]||0)+s.durationMs;});state.tasks.forEach(tk=>{if(!t[tk.tag])t[tk.tag]=0;});return Object.keys(t);}
function todayStr(){return ymd(new Date());}
function incompleteTasks(){const t=todayStr();return state.tasks.filter(x=>!x.done&&x.date<=t);}
function rolledTasks(){const t=todayStr();return state.tasks.filter(x=>!x.done&&x.date<t);}
function taskFocusDays(t){const days=new Set();(state.sessions||[]).forEach(s=>{if(s.taskName===t.name&&s.tag===t.tag&&s.date>=t.date)days.add(s.date);});return days.size;}
function todayTasks(){const t=todayStr();return state.tasks.filter(x=>x.date===t);}
function sessionsOn(dateStr){return state.sessions.filter(s=>s.date===dateStr);}
function aggregateByTag(){
  const m={};
  state.sessions.forEach(s=>{
    if(!m[s.tag]) m[s.tag]={tag:s.tag,total:0,count:0,days:new Set()};
    m[s.tag].total+=s.durationMs; m[s.tag].count++; m[s.tag].days.add(s.date);
  });
  return Object.values(m).map(x=>({...x,dayCount:x.days.size}));
}
function weekRange(offset){
  const start=weekStart(addDays(new Date(),(offset||0)*7));
  const days=[];for(let i=0;i<7;i++)days.push(ymd(addDays(start,i)));
  return {start,days};
}
function weekSessions(offset){
  const {days}=weekRange(offset);
  return state.sessions.filter(s=>days.includes(s.date));
}
const PAUSE_LIMIT_MS=10*60*1000; // 暂停缓冲上限 10 分钟
function elapsedMs(){
  if(!state.timer)return 0;
  const t=state.timer; const base=t.accumulated||0;
  const extra=t.paused?0:Date.now()-new Date(t.start).getTime();
  return base+extra;
}
function fmtTimerRange(){
  if(!state.timer)return '';
  const t=state.timer;
  const st=new Date(t.start);
  const en=new Date(st.getTime()+elapsedMs());
  return pad(st.getHours())+':'+pad(st.getMinutes())+' - '+pad(en.getHours())+':'+pad(en.getMinutes());
}

/* ============ 渲染层 ============ */
/* ===== 时段问候 + 可爱颜文字（移植自雅思词汇页） ===== */
const HAPPY_FACES=[
  '(づ￣ 3￣)づ mua~',
  '(*≧ω≦) mua~',
  '(♡‿♡) mua~',
  '(✿◡‿◡) mua~',
  '(◍•ᴗ•◍) mua~',
  '(•‿•) mua~',
  '(≧▽≦) mua~',
  'ヽ(✿ﾟ▽ﾟ)ノ mua~',
  '(*^_^*) mua~',
  '\\(@^0^@)/ mua~',
  '（づ￣3￣）づ╭❤～'
];
function randomHappyFace(){return HAPPY_FACES[Math.floor(Math.random()*HAPPY_FACES.length)];}
let _lastGreetWord='';
function renderGreeting(){
  const h=new Date().getHours();
  let word;
  if(h>=5&&h<11) word='早上好，主人！';
  else if(h>=11&&h<14) word='中午好，主人！';
  else if(h>=14&&h<18) word='下午好，主人！';
  else word='晚上好，主人！';
  const el=document.getElementById('greeting');
  if(!el) return;
  if(word!==_lastGreetWord){
    _lastGreetWord=word;
    el.innerHTML=word+' <span class="kaomoji">'+randomHappyFace()+'</span>';
  }
}
function shuffleGreetingFace(){
  const el=document.getElementById('greeting');
  if(!el) return;
  const span=el.querySelector('.kaomoji');
  if(!span) return;
  let f=randomHappyFace(), guard=0;
  while(span.textContent===f && guard<12){ f=randomHappyFace(); guard++; }
  span.textContent=f;
}

function renderClock(){
  const d=new Date();
  const wk=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('clock').innerHTML=
    d.getFullYear()+'年'+pad(d.getMonth()+1)+'月'+pad(d.getDate())+'日 周'+wk+
    ' <b>'+pad(d.getHours())+':'+pad(d.getMinutes())+'</b>';
  renderGreeting();
}
function renderTimer(){
  const t=state.timer;
  const wrap=document.getElementById('timerSelWrap');
  const body=document.getElementById('timerBody');
  const btns=document.getElementById('timerBtns');
  if(!t){
    wrap.style.display='block';
    const sel=document.getElementById('timerSel');
    const tasks=incompleteTasks();
    sel.innerHTML='<option value="">— 选择任务开始专注 —</option>'+
      tasks.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'（'+esc(x.tag)+'）</option>').join('');
    body.innerHTML='<div class="timer-idle">选一个任务，开始你的专注时光 ✦</div>';
    btns.innerHTML='<button class="big-btn start" onclick="startFromSelect()">开始计时</button>';
  }else{
    wrap.style.display='none';
    const paused=t.paused;
    body.innerHTML='<div class="timer-task">正在专注：<b>'+esc(t.taskName)+'</b> '+
      '<span class="tag-chip" style="background:'+tagColor(t.tag)+'">'+esc(t.tag)+'</span>'+
      (paused?'<span class="paused-tag">已暂停</span>':'')+'</div>'+
      '<div class="timer-display">'+fmtHMS(elapsedMs())+'</div>'+
      '<div class="timer-range">'+fmtTimerRange()+'</div>';
    if(paused){
      btns.innerHTML='<button class="big-btn start" onclick="resumeTimer()">继续</button>'+
        '<button class="big-btn stop" onclick="endTimer()">结束</button>'+
        '<div id="pauseCountdown" class="pause-countdown"></div>';
    }else{
      btns.innerHTML='<button class="big-btn ghost" onclick="pauseTimer()">暂停</button>'+
        '<button class="big-btn stop" onclick="endTimer()">结束</button>';
    }
  }
}
function renderTagChips(){
  const c=document.getElementById('tagChips'); if(!c)return;
  c.innerHTML=getTags().map(t=>'<button type="button" class="chip" onclick="useTag(\''+esc(t)+'\')" style="background:'+tagColor(t)+'">'+esc(t)+'</button>').join('');
}
function useTag(t){ document.getElementById('tagInput').value=t; }
function fmtMD(s){ if(!s)return ''; const d=parseYMD(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function daysLeft(dl){
  if(!dl) return null;
  const today=parseYMD(todayStr()); const target=parseYMD(dl);
  return Math.round((target-today)/86400000);
}
function fmtDaysLeft(dl){
  const n=daysLeft(dl);
  if(n===null) return '';
  if(n>0) return '还有 '+n+' 天';
  if(n===0) return '就是今天';
  return '已逾期 '+(-n)+' 天';
}
function isArchived(t){ return !!(t.done && t.completedAt && t.completedAt<todayStr() && !t.pinned); }
function activeTasks(){ return state.tasks.filter(t=>!isArchived(t)); }
function archivedTasks(){ return state.tasks.filter(t=>isArchived(t)).sort((a,b)=>String(b.completedAt||'').localeCompare(String(a.completedAt||''))); }
function togglePin(id){ const t=state.tasks.find(x=>x.id===id); if(!t)return; t.pinned=!t.pinned; saveState(); refreshAll(); toast(t.pinned?'已置顶今日':'已取消置顶'); }
function toggleArchive(){ const w=document.getElementById('archiveWrap'); const b=document.getElementById('archiveToggle'); const l=document.getElementById('archiveList'); const open=w.classList.toggle('open'); b.classList.toggle('open',open); l.style.display=open?'block':'none'; }
function demoHintBtn(){ if(getMode()==='demo') return ''; return '<div class="empty-demo"><button class="mini-btn ghost" onclick="switchMode(\'demo\')">看看示例数据</button></div>'; }
function renderTaskList(){
  const box=document.getElementById('taskList');
  let list=activeTasks().slice();
  list.sort((a,b)=> (a.date<b.date?-1:(a.date>b.date?1:0)));
  let html='';
  list.forEach(t=>{
    const rolled=t.date<todayStr() && !t.done;
    if(t.id===editId){
      html+='<div class="task-item editing">'+
        '<input id="editName" value="'+esc(t.name)+'">'+
        '<input id="editTag" value="'+esc(t.tag)+'" list="tagList">'+
        '<input id="editSubtag" value="'+esc(t.subtag||'')+'" list="subtagList" placeholder="子标签">'+
        '<button class="mini-btn" onclick="saveEdit(\''+t.id+'\')">保存</button>'+
        '<button class="mini-btn ghost" onclick="cancelEdit()">取消</button></div>';
      return;
    }
    const dim=t.done?' done':'';
    const isPinned=!!t.pinned;
    html+='<div class="task-item'+dim+'">'+
      '<div class="chk" onclick="toggleTask(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>'+
      '<div class="tname">'+esc(t.name)+'<small>'+esc(t.tag)+(t.subtag?' · '+esc(t.subtag):'')+'</small></div>'+
      (rolled?'<span class="badge rolled">已经 '+taskFocusDays(t)+' 天</span>':'')+
      (t.done?'<span class="badge" style="background:rgba(52,211,153,.16);color:#0E9F6E">今日完成</span>':'')+
      (isPinned?'<span class="badge" style="background:rgba(250,204,21,.18);color:#B45309">📌置顶</span>':'')+
      '<span class="tag-chip" style="background:'+tagColor(t.tag)+'">'+esc(t.tag)+'</span>'+
      (t.done?'<button class="mini-btn ghost" onclick="togglePin(\''+t.id+'\')">'+(isPinned?'取消置顶':'📌置顶')+'</button>':'<button class="mini-btn" onclick="startTimerById(\''+t.id+'\')">计时</button>')+
      '<button class="mini-btn ghost" onclick="editTask(\''+t.id+'\')">编辑</button>'+
      '<button class="mini-btn del" onclick="deleteTask(\''+t.id+'\')">×</button>'+
    '</div>';
  });
  if(!html) html='<div class="empty-hint">还没有任务，上面添加一条～'+demoHintBtn()+'</div>';
  box.innerHTML=html;
  document.getElementById('tagList').innerHTML=getTags().map(t=>'<option value="'+esc(t)+'">').join('');
  const subs=[...new Set(state.tasks.map(t=>t.subtag).filter(Boolean))];
  document.getElementById('subtagList').innerHTML=subs.map(s=>'<option value="'+esc(s)+'">').join('');
  renderTagChips();
  renderArchive();
}
function renderArchive(){
  const box=document.getElementById('archiveList'); const cnt=document.getElementById('archiveCount');
  if(!box) return;
  const list=archivedTasks();
  cnt.textContent='('+list.length+')';
  if(!list.length){ box.innerHTML='<div class="empty-hint" style="padding:18px 0">暂无归档任务～ 完成的任务第二天会自动来到这里</div>'; return; }
  let html='';
  list.forEach(t=>{
    const dt=t.completedAt||t.date;
    html+='<div class="task-item done">'+
      '<div class="chk done" onclick="toggleTask(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>'+
      '<div class="tname">'+esc(t.name)+'<small>'+esc(t.tag)+(t.subtag?' · '+esc(t.subtag):'')+' · ✓ '+fmtMD(dt)+' 已完成</small></div>'+
      '<span class="tag-chip" style="background:'+tagColor(t.tag)+'">'+esc(t.tag)+'</span>'+
      '<button class="mini-btn ghost" onclick="deleteTask(\''+t.id+'\')">删除</button>'+
    '</div>';
  });
  box.innerHTML=html;
}
function renderTimeBlocks(){
  const seg=document.getElementById('blkSeg');
  [...seg.children].forEach(b=>b.classList.toggle('active',b.dataset.bv===state.blkView));
  const box=document.getElementById('timeBlocks');
  const label=document.getElementById('blkLabel');
  if(state.blkView==='day'){
    const d=state.selectedDate;
    label.textContent=d+'（日视图）';
    box.innerHTML=renderDayView(sessionsOn(d), state.timer&&!state.timer.paused?liveSession():null, 44);
  }else if(state.blkView==='week'){
    const start=weekStart(parseYMD(state.selectedDate));
    const end=ymd(addDays(start,6));
    label.textContent=ymd(start)+' ~ '+end+'（周视图）';
    box.innerHTML=renderWeekView(start);
  }else{
    const d=parseYMD(state.selectedDate);
    const y=d.getFullYear(),m=d.getMonth();
    label.textContent=y+'年'+(m+1)+'月（月视图）';
    box.innerHTML=renderMonthView(y,m);
  }
}
function liveSession(){
  const t=state.timer;
  return {taskName:t.taskName,tag:t.tag,start:t.start,end:new Date().toISOString()};
}
function renderDayView(sessions, live, hourH){
  const H=24,total=H*hourH;
  let blocks='';
  const all=live?[...sessions,live]:sessions;
  all.forEach(s=>{
    const st=new Date(s.start); const en=new Date(s.end);
    let h0=st.getHours()+st.getMinutes()/60;
    let h1=en.getHours()+en.getMinutes()/60;
    if(h1<=h0)h1=h0+0.5;
    if(h1>24)h1=24;
    const top=h0*hourH,height=Math.max((h1-h0)*hourH,18);
    const restMin=s.restMs?Math.round(s.restMs/60000):0;
    const tipTxt=esc(s.taskName)+' · '+pad(st.getHours())+':'+pad(st.getMinutes())+' - '+pad(en.getHours())+':'+pad(en.getMinutes())+(restMin?('（含休息 '+restMin+' 分钟）'):'');
    blocks+='<div class="blk" data-tip="'+tipTxt+'" style="top:'+top+'px;height:'+height+'px;background:'+tagColor(s.tag)+'">'+
      '<span class="blk-t">'+esc(s.taskName)+'</span><span class="blk-d">'+esc(s.tag)+' · '+fmtHMshort((h1-h0)*3600000)+(restMin?(' · 休'+restMin+'分'):'')+'</span></div>';
  });
  let labels='';
  for(let i=0;i<24;i++)labels+='<div class="hr" style="top:'+(i*hourH)+'px">'+pad(i)+':00</div>';
  if(!all.length) return '<div class="empty-hint">这一天还没有时间记录，开始计时就会出现在时间块里～</div>';
  return '<div class="timeline" style="height:'+total+'px">'+labels+blocks+'</div>';
}
function bindBlkTip(){
  const box=document.getElementById('timeBlocks');
  const tip=document.getElementById('blkTip');
  if(!box||!tip)return;
  if(box.dataset.tipBound)return; box.dataset.tipBound='1';
  const place=(cx,cy)=>{
    let x=cx+6,y=cy+6;
    const r=tip.getBoundingClientRect();
    if(x+r.width>window.innerWidth-6)x=cx-r.width-6;
    if(y+r.height>window.innerHeight-6)y=cy-r.height-6;
    if(x<6)x=6; if(y<6)y=6;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  };
  box.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tip]'); if(!el)return;
    tip.textContent=el.getAttribute('data-tip'); tip.classList.add('show'); place(e.clientX,e.clientY);
  });
  box.addEventListener('mousemove',e=>{
    if(!tip.classList.contains('show'))return; place(e.clientX,e.clientY);
  });
  box.addEventListener('mouseout',e=>{
    const el=e.target.closest('[data-tip]'); if(!el)return;
    const to=e.relatedTarget; if(to&&el.contains(to))return;
    tip.classList.remove('show');
  });
}
function renderWeekView(start){
  let html='<div class="wk-grid">';
  const wd=['一','二','三','四','五','六','日'];
  for(let i=0;i<7;i++){
    const ds=ymd(addDays(start,i));
    const sess=sessionsOn(ds);
    let blocks='';
    const hourH=13, H=24;
    sess.forEach(s=>{
      const st=new Date(s.start);
      let h0=st.getHours()+st.getMinutes()/60;
      const dur=Math.max(s.durationMs/3600000,0.5);
      const top=h0*hourH,height=dur*hourH;
      if(top>24*hourH)return;
      const enT=new Date(st.getTime()+s.durationMs);
      const tipT=esc(s.taskName)+' · '+pad(st.getHours())+':'+pad(st.getMinutes())+' - '+pad(enT.getHours())+':'+pad(enT.getMinutes())+(s.restMs?('（含休息 '+Math.round(s.restMs/60000)+' 分钟）'):'');
      blocks+='<div class="wblk" data-tip="'+tipT+'" style="top:'+top+'px;height:'+height+'px;background:'+tagColor(s.tag)+'" title="'+esc(s.taskName)+'">'+esc(s.tag)+'</div>';
    });
    const isToday=ds===todayStr();
    html+='<div class="wk-col'+(isToday?' today':'')+'"><div class="wd">周'+wd[i]+'<b>'+pad(parseYMD(ds).getDate())+'</b></div>'+blocks+'</div>';
  }
  html+='</div>';
  return html;
}
function renderMonthView(y,m){
  const first=new Date(y,m,1); const startPad=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  let html='<div class="mo-grid">';
  const wd=['一','二','三','四','五','六','日'];
  wd.forEach(w=>html+='<div style="text-align:center;font-size:11px;color:var(--muted-2);font-weight:600;padding:4px 0">'+w+'</div>');
  for(let i=0;i<startPad;i++)html+='<div class="mo-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=ymd(new Date(y,m,d));
    const sess=sessionsOn(ds);
    let bars=''; let max=0; const byTag={};
    sess.forEach(s=>{byTag[s.tag]=(byTag[s.tag]||0)+s.durationMs;max=Math.max(max,byTag[s.tag]);});
    if(sess.length){
      Object.keys(byTag).forEach(t=>{
        const pct=Math.max(10,Math.round(byTag[t]/max*100));
        bars+='<div class="mo-bar" style="width:'+pct+'%;background:'+tagColor(t)+'"></div>';
      });
    }
    const isToday=ds===todayStr();
    html+='<div class="mo-cell'+(isToday?' today':'')+'" onclick="gotoDay(\''+ds+'\')"><div class="md">'+d+'</div><div class="mo-bars">'+bars+'</div></div>';
  }
  html+='</div>';
  return html;
}
function renderBoard(){
  const ag=aggregateByTag().sort((a,b)=>b.total-a.total);
  const box=document.getElementById('boardTags');
  if(!ag.length){box.innerHTML='<div class="empty-hint">还没有时间记录，去今日页计时吧～</div>';return;}
  let html='';
  ag.forEach(a=>{
    const items=state.sessions.filter(s=>s.tag===a.tag).sort((x,y)=>y.date.localeCompare(x.date));
    let lis='';
    const seen=new Set();
    items.forEach(s=>{
      if(seen.has(s.date))return; seen.add(s.date);
      const dayItems=items.filter(x=>x.date===s.date);
      const names=dayItems.map(x=>x.taskName+'('+fmtHMshort(x.durationMs)+')').join('、');
      lis+='<div class="li"><span>'+s.date+' · '+names+'</span><span>'+fmtHMshort(dayItems.reduce((p,c)=>p+c.durationMs,0))+'</span></div>';
    });
    html+='<div class="tag-card"><div class="tag-head">'+
      '<span class="tag-chip" style="background:'+tagColor(a.tag)+'">'+esc(a.tag)+'</span>'+
      '<div class="tag-stat"><b>'+fmtHm(a.total)+'</b>'+a.count+'次 · '+a.dayCount+'天</div></div>'+
      '<div class="tag-list">'+lis+'</div></div>';
  });
  box.innerHTML=html;
}
function renderWeekly(){
  const {start,days}=weekRange(weekOffset);
  const isCurWeek=weekOffset===0;
  const barsBox=document.getElementById('weekBars');
  const maxMs=Math.max(1,...days.map(d=>sessionsOn(d).reduce((p,c)=>p+c.durationMs,0)));
  let html='';
  const wd=['一','二','三','四','五','六','日'];
  days.forEach((d,i)=>{
    const total=sessionsOn(d).reduce((p,c)=>p+c.durationMs,0);
    const h=Math.round(total/maxMs*100);
    const isToday=isCurWeek&&d===todayStr();
    html+='<div class="bar-col"><div class="bv">'+(total?fmtHMshort(total):'')+'</div>'+
      '<div class="bar" style="height:'+h+'%;background:'+(isToday?'linear-gradient(180deg,#7C6CF6,#5B7CFA)':'linear-gradient(180deg,#8FB0FF,#5B7CFA)')+'"></div>'+
      '<div class="bl">周'+wd[i]+'</div></div>';
  });
  barsBox.innerHTML=html;

  const ws=weekSessions(weekOffset);
  const byTag={}; ws.forEach(s=>byTag[s.tag]=(byTag[s.tag]||0)+s.durationMs);
  const total=ws.reduce((p,c)=>p+c.durationMs,0)||1;
  const ring=document.getElementById('weekRing'); const legend=document.getElementById('weekLegend');
  let acc=0,paths='',lg='';
  const C=85,R=62,cx=85,cy=85;
  const keys=Object.keys(byTag).sort((a,b)=>byTag[b]-byTag[a]);
  if(!keys.length){ring.innerHTML='';legend.innerHTML='<span style="color:var(--muted)">'+(isCurWeek?'本周':'该周')+'暂无记录</span>';}
  else{
    keys.forEach(k=>{
      const frac=byTag[k]/total; const a0=acc*2*Math.PI-Math.PI/2; acc+=frac; const a1=acc*2*Math.PI-Math.PI/2;
      const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
      const large=frac>0.5?1:0;
      paths+='<path d="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+R+' '+R+' 0 '+large+' 1 '+x1+' '+y1+' Z" fill="'+tagColor(k)+'"/>';
      lg+='<div class="lg"><span class="sw" style="background:'+tagColor(k)+'"></span>'+esc(k)+' · '+fmtHMshort(byTag[k])+'（'+Math.round(frac*100)+'%）</div>';
    });
    const centerLabel=isCurWeek?'本周':(pad(start.getMonth()+1)+'/'+pad(start.getDate()));
    ring.innerHTML='<circle cx="85" cy="85" r="'+R+'" fill="none" stroke="rgba(148,163,184,.25)" stroke-width="20"/>'+paths+
      '<text x="85" y="80" text-anchor="middle" font-size="13" fill="#94A3B8">'+centerLabel+'</text>'+
      '<text x="85" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">'+fmtHMshort(total)+'</text>';
    legend.innerHTML=lg;
  }

  let streak=0; let cur=new Date();
  while(true){
    const ds=ymd(cur);
    if(sessionsOn(ds).length>0||state.tasks.some(t=>t.date===ds&&t.done)){streak++;cur=addDays(cur,-1);}
    else break;
  }
  document.getElementById('streakNum').textContent=streak;

  const weekKey=ymd(start);
  const note=document.getElementById('weekSummary');
  const autoBtn=document.getElementById('regenNote');
  const saved=state.weeklyNotes[weekKey];
  if(!saved){
    const topTag=keys.length?keys[0]:'—';
    const note2=(isCurWeek?'本周':'该周')+'共专注 '+fmtHm(total)+'，最投入的标签是「'+topTag+'」（'+fmtHMshort(byTag[topTag]||0)+'），连续打卡 '+streak+' 天。'+(streak>=3?'保持得不错，继续加油！':'迈开第一步，明天会更好！');
    note.value=note2;
    document.getElementById('autoNote').textContent='（以上为自动生成，可直接修改）';
    autoBtn.style.display='none';
  }else{
    note.value=saved;
    document.getElementById('autoNote').textContent='（已锁定为你手动修改的版本）';
    autoBtn.style.display='inline-block';
  }
  renderWeekLabel();
}
function renderWeekLabel(){
  const {start,days}=weekRange(weekOffset);
  const lab=document.getElementById('weekLabel');
  const prev=document.getElementById('weekPrev');
  const next=document.getElementById('weekNext');
  let txt;
  if(weekOffset===0) txt='本周';
  else if(weekOffset===-1) txt='上周';
  else if(weekOffset===-2) txt='上上周';
  else txt='前第 '+(-weekOffset)+' 周';
  lab.textContent=txt+' · '+days[0].slice(5)+' ~ '+days[6].slice(5);
  prev.disabled=false;
  next.disabled=true;
}
function changeWeek(delta){
  weekOffset+=delta;
  if(weekOffset>0) weekOffset=0;
  renderWeekly();
}
function goThisWeek(){ weekOffset=0; renderWeekly(); }
function regenWeeklyNote(){
  const {start}=weekRange(weekOffset);
  delete state.weeklyNotes[ymd(start)];
  saveState(); renderWeekly();
}
function renderBackup(){
  const banner=document.getElementById('warnBanner');
  if(state.sessions.length>=30){banner.style.display='block';banner.textContent='数据已积累 '+state.sessions.length+' 条，建议点「导出 JSON」备份一下～';}
  else banner.style.display='none';
}

/* ============ 目标思维导图 ============ */
let mmScope='all';
let mmExpanded=true;
let mmFrom='';
let mmTo='';
function ringSVG(pct,size){
  pct=Math.max(0,Math.min(1,pct||0));
  const r=(size-12)/2, c=size/2, circ=2*Math.PI*r;
  const off=circ*(1-pct);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="rgba(148,163,184,.25)" stroke-width="6"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#5B7CFA" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+c+' '+c+')"/>'+
    '<text x="'+c+'" y="'+(c+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">'+Math.round(pct*100)+'%</text></svg>';
}
function scopeTasks(scope){
  let tasks=state.tasks;
  if(scope==='week'){ const {days}=weekRange(0); return tasks.filter(t=>days.includes(t.date)||(t.completedAt&&days.includes(t.completedAt))); }
  if(scope==='month'){ const n=new Date(); const arr=[]; for(let d=1; d<=n.getDate(); d++) arr.push(ymd(new Date(n.getFullYear(),n.getMonth(),d))); return tasks.filter(t=>arr.includes(t.date)||(t.completedAt&&arr.includes(t.completedAt))); }
  if(scope==='custom'){
    if(!mmFrom||!mmTo) return tasks;
    return tasks.filter(t=>(t.date&&t.date>=mmFrom&&t.date<=mmTo)||(t.completedAt&&t.completedAt>=mmFrom&&t.completedAt<=mmTo));
  }
  return tasks;
}
function mmLeaf(t){
  const dt=t.completedAt||t.date; const dn=t.done;
  return '<li><div class="mm-leaf'+(dn?' done':'')+'">'+esc(t.name)+(dn?' <span class="mm-done">✓ '+fmtMD(dt)+' 已完成</span>':' <span class="mm-pend">待完成</span>')+'</div></li>';
}
function buildMindmapHTML(scope){
  const tasks=scopeTasks(scope);
  const byTag={};
  tasks.forEach(t=>{ const tg=t.tag||'未分类'; const sg=(t.subtag||'').trim(); byTag[tg]=byTag[tg]||{}; byTag[tg][sg]=byTag[tg][sg]||[]; byTag[tg][sg].push(t); });
  const tags=Object.keys(byTag).sort((a,b)=>{
    const ca=byTag[a], cb=byTag[b];
    const ta=Object.values(ca).reduce((p,a2)=>p+a2.length,0), tb=Object.values(cb).reduce((p,b2)=>p+b2.length,0);
    return tb-ta;
  });
  if(!tags.length) return '<div class="empty-hint">这段时间还没有任务，换个范围或去今日页添加吧～'+((scope==='custom'&&mmFrom&&mmTo)?'（'+mmFrom+' ~ '+mmTo+'）':'')+demoHintBtn()+'</div>';
  let rootLabel='🎯 总目标';
  if(scope==='week') rootLabel='🎯 本周';
  else if(scope==='month') rootLabel='🎯 本月';
  else if(scope==='custom') rootLabel='🎯 '+mmFrom+' ~ '+mmTo;
  let html='<ul class="mm-tree"><li><div class="mm-root">'+esc(rootLabel)+'</div><ul>';
  tags.forEach(tg=>{
    const subs=byTag[tg]; let total=0, done=0;
    Object.values(subs).forEach(arr=>arr.forEach(t=>{ total++; if(t.done) done++; }));
    html+='<li><div class="mm-tagnode">'+ringSVG(done/total,38)+'<span class="mm-tname">'+esc(tg)+'</span><span class="mm-frac">'+done+'/'+total+'</span></div>';
    if(mmExpanded){
      html+='<ul>';
      const subKeys=Object.keys(subs).filter(k=>k!=='').sort();
      subKeys.forEach(sg=>{
        html+='<li><div class="mm-subnode">'+esc(sg)+'</div>';
        if(mmExpanded){ html+='<ul>'; subs[sg].forEach(t=>{ html+=mmLeaf(t); }); html+='</ul>'; }
        html+='</li>';
      });
      if(mmExpanded){ (subs['']||[]).forEach(t=>{ html+=mmLeaf(t); }); }
      html+='</ul>';
    }
    html+='</li>';
  });
  html+='</ul></li></ul>';
  return html;
}
function renderMindmap(){
  const box=document.getElementById('mindmap'); if(!box) return;
  const rg=document.getElementById('mmRange');
  if(rg) rg.style.display=(mmScope==='custom')?'flex':'none';
  const fb=document.getElementById('mmFromBtn'), tb=document.getElementById('mmToBtn');
  if(fb){ fb.textContent=mmFrom?('\U0001f4c5 '+fmtMD(mmFrom)):'\U0001f4c5 开始日期'; fb.className='mm-datebtn'+(mmFrom?'':' empty'); }
  if(tb){ tb.textContent=mmTo?('\U0001f4c5 '+fmtMD(mmTo)):'\U0001f4c5 结束日期'; tb.className='mm-datebtn'+(mmTo?'':' empty'); }
  box.innerHTML=buildMindmapHTML(mmScope);
  document.querySelectorAll('.mm-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.scope===mmScope));
  const tri=document.getElementById('mmTriBtn');
  if(tri){ tri.className='mm-tri'+(mmExpanded?' open':''); tri.setAttribute('aria-expanded',mmExpanded?'true':'false'); }
  const tt=document.getElementById('mmTriText');
  if(tt) tt.textContent = mmExpanded?'全部：展开到具体任务':'一级：只看各标签';
  const tip=document.getElementById('mmLevTip');
  if(tip) tip.textContent = mmExpanded?'点三角可收起，只看各标签及完成度':'点三角展开到具体任务及完成日期';
}
function resetMMRange(){ mmFrom=ymd(addDays(new Date(),-6)); mmTo=todayStr(); renderMindmap(); toast('已重置为近 7 天'); }
function mmSetDefaults(){ if(!mmFrom||!mmTo){ mmFrom=ymd(addDays(new Date(),-6)); mmTo=todayStr(); } }
function setMM(scope){ mmScope=scope; if(scope==='custom') mmSetDefaults(); renderMindmap(); }
function toggleMM(){ mmExpanded=!mmExpanded; renderMindmap(); }

/* ============ 周报日历弹窗 ============ */
let calMonth=new Date();
function openWeekCal(){ calMonth=new Date(); renderWeekCal(); document.getElementById('weekCal').style.display='flex'; }
function closeWeekCal(){ document.getElementById('weekCal').style.display='none'; }
function renderWeekCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1); const startPad=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=todayStr();
  const curWs=weekStart(new Date()).getTime();
  let html='<div class="cal-head"><button id="calPrev">‹</button><span>'+y+'年'+(m+1)+'月</span><button id="calNext">›</button></div>';
  html+='<div class="cal-grid">';
  const wd=['一','二','三','四','五','六','日'];
  wd.forEach(w=>html+='<div class="cal-wd">'+w+'</div>');
  for(let i=0;i<startPad;i++) html+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds=ymd(new Date(y,m,d));
    const inCurWeek = weekStart(parseYMD(ds)).getTime()===curWs;
    const hasAct = state.sessions.some(s=>s.date===ds) || state.tasks.some(t=>t.date===ds||(t.completedAt&&t.completedAt===ds));
    html+='<div class="cal-cell'+(ds===today?' today':'')+(inCurWeek?' curweek':'')+'" onclick="pickWeekDate(\''+ds+'\')">'+d+(hasAct?'<i class="cal-dot"></i>':'')+'</div>';
  }
  html+='</div>';
  const box=document.getElementById('calBox');
  box.innerHTML=html;
  document.getElementById('calPrev').onclick=()=>{ calMonth=new Date(y, m-1, 1); renderWeekCal(); };
  document.getElementById('calNext').onclick=()=>{ calMonth=new Date(y, m+1, 1); renderWeekCal(); };
}
/* ============ 通用日期选择弹窗（导图自定义区间复用同款日历） ============ */
let dateCalMonth=new Date();
let dateCalTarget='from';
function openDateCal(which){
  dateCalTarget=which;
  const base=(which==='from'?mmFrom:mmTo)||todayStr();
  const d=parseYMD(base)||new Date();
  dateCalMonth=new Date(d.getFullYear(),d.getMonth(),1);
  renderDateCal();
  document.getElementById('datePop').style.display='flex';
}
function closeDateCal(){ document.getElementById('datePop').style.display='none'; }
function renderDateCal(){
  const y=dateCalMonth.getFullYear(), m=dateCalMonth.getMonth();
  const first=new Date(y,m,1); const startPad=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  const today=todayStr();
  let html='<div class="cal-head"><button id="dcalPrev">\u2039</button><span>'+y+'\u5e74'+(m+1)+'\u6708</span><button id="dcalNext">\u203a</button></div>';
  html+='<div class="cal-grid">';
  const wd=['\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d','\u65e5'];
  wd.forEach(w=>html+='<div class="cal-wd">'+w+'</div>');
  for(let i=0;i<startPad;i++) html+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=dim; d++){
    const ds=ymd(new Date(y,m,d));
    const isEnd=(ds===mmFrom||ds===mmTo);
    const inR=!!(mmFrom&&mmTo&&ds>mmFrom&&ds<mmTo);
    html+='<div class="cal-cell'+(ds===today?' today':'')+(isEnd?' sel':'')+(inR?' inrange':'')+'" onclick="pickDateCal(\''+ds+'\')">'+d+'</div>';
  }
  html+='</div>';
  html+='<div class="cal-foot"><span>'+(dateCalTarget==='from'?'\u9009\u62e9\u5f00\u59cb\u65e5\u671f':'\u9009\u62e9\u7ed3\u675f\u65e5\u671f')+'</span><button class="mini-btn" onclick="closeDateCal()">\u5173\u95ed</button></div>';
  const box=document.getElementById('dateBox');
  box.innerHTML=html;
  document.getElementById('dcalPrev').onclick=()=>{ dateCalMonth=new Date(y, m-1, 1); renderDateCal(); };
  document.getElementById('dcalNext').onclick=()=>{ dateCalMonth=new Date(y, m+1, 1); renderDateCal(); };
}
function pickDateCal(ds){
  if(dateCalTarget==='from'){ mmFrom=ds; if(mmTo&&mmTo<ds) mmTo=ds; }
  else { mmTo=ds; if(mmFrom&&mmFrom>ds) mmFrom=ds; }
  closeDateCal();
  renderMindmap();
  toast('\u5df2\u9009\u62e9 '+fmtMD(ds));
}
function pickWeekDate(ds){
  const selWs=weekStart(parseYMD(ds)); const curWs=weekStart(new Date());
  let off=Math.round((selWs-curWs)/(7*86400000));
  if(off>0) off=0;
  weekOffset=off; closeWeekCal(); renderWeekly();
}

/* ============ 统一刷新入口 ============ */

let lgArchOpen=false;
let lgEditing=null;
function addLongGoal(){
  const nm=document.getElementById('lgName'); const tg=document.getElementById('lgTag'); const dl=document.getElementById('lgDeadline');
  if(!nm) return;
  const name=nm.value.trim(); const tag=(tg?tg.value.trim():'')||'其他'; const deadline=dl?dl.value:'';
  if(!name){ toast('先写个目标名吧～'); return; }
  state.longGoals.push({id:uid(),name:name,tag:tag,deadline:deadline,note:'',done:false,completedAt:''});
  saveState(); refreshAll();
  nm.value=''; if(tg)tg.value=''; if(dl)dl.value='';
  toast('已添加长期目标'); playSfx('add');
}
function completeLongGoal(id){
  const g=state.longGoals.find(x=>x.id===id); if(!g)return;
  g.done=true; g.completedAt=todayStr();
  saveState(); refreshAll(); toast('已完成 ✓'); playSfx('done');
}
function uncompleteLongGoal(id){
  const g=state.longGoals.find(x=>x.id===id); if(!g)return;
  g.done=false; g.completedAt='';
  saveState(); refreshAll(); toast('已恢复为未完成'); playSfx('add');
}
function moveLongGoal(fromId,toId){
  const list=state.longGoals||[];
  const fi=list.findIndex(x=>x.id===fromId); const ti=list.findIndex(x=>x.id===toId);
  if(fi<0||ti<0||fi===ti) return;
  const [it]=list.splice(fi,1); list.splice(ti,0,it);
  saveState(); renderLongGoals();
}
function bindLGDrag(){
  const box=document.getElementById('lgList'); if(!box) return;
  let dragId=null;
  box.querySelectorAll('.lg-item[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ dragId=el.dataset.gid; el.classList.add('dragging'); try{e.dataTransfer.setData('text/plain',dragId);}catch(_){} });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); box.querySelectorAll('.lg-item').forEach(x=>x.classList.remove('drag-over')); });
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave',()=>{ el.classList.remove('drag-over'); });
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('drag-over'); const to=el.dataset.gid; if(dragId&&to&&dragId!==to) moveLongGoal(dragId,to); });
  });
}
function deleteLongGoal(id){
  state.longGoals=state.longGoals.filter(x=>x.id!==id);
  saveState(); refreshAll(); toast('已删除');
}
function setLGNote(id,val){
  const g=state.longGoals.find(x=>x.id===id); if(!g)return;
  g.note=val; saveState();
}
function toggleLGArchive(){ lgArchOpen=!lgArchOpen; renderLongGoals(); }
function editLongGoal(id){ lgEditing=id; renderLongGoals(); }
function cancelLgEdit(){ lgEditing=null; renderLongGoals(); }
function saveLongGoal(id){
  const g=state.longGoals.find(x=>x.id===id); if(!g)return;

  saveState(); refreshAll(); toast('开始：'+t.name); playSfx('start');
}
function pauseTimer(){
  if(!state.timer||state.timer.paused)return;
  const t=state.timer;
  t.accumulated+=Date.now()-new Date(t.start).getTime(); // 累计专注时长（不含休息）
  t.focusMs=t.accumulated;                                // 暂停那一刻的纯专注时长
  t.pausedAt=new Date().toISOString();                    // 暂停开始时刻
  t.paused=true; t.restMs=0;
  saveState(); refreshAll(); toast('已暂停 · 10 分钟内继续，休息也算专注，超时自动结束');
}
function resumeTimer(){
  if(!state.timer||!state.timer.paused)return;
  const t=state.timer;
  // 这段休息时长（≤10 分钟，因为超时会自动结束）计入总时长
  const restMs=Date.now()-new Date(t.pausedAt||t.start).getTime();
  t.restMs=(t.restMs||0)+restMs;
  // 把休息时长塞回 accumulated，使 elapsedMs() 继续累计
  t.accumulated=(t.accumulated||0)+restMs;
  t.start=new Date().toISOString(); t.paused=false; t.pausedAt=null;
  saveState(); refreshAll(); toast('继续专注 · 本次休息 '+fmtHM(restMs));
}
function endTimer(auto){
  if(!state.timer)return;
  auto=(auto===true);
  const t=state.timer;
  // 自动结束（暂停超时）：总时长只算到暂停那一刻（不含那 10 分钟休息）
  const total=(auto && t.paused) ? (t.focusMs||t.accumulated||0) : elapsedMs();
  if(total<60000){ state.timer=null; saveState(); refreshAll(); toast('专注不足 1 分钟，不计入时长'); return; }
  // 起始时间：累加模式下 start 会被不断重置，用「开始时刻」需从 accumulated 反推
  const endDate=(auto && t.paused && t.pausedAt) ? new Date(t.pausedAt) : new Date();
  const startDate=new Date(endDate.getTime()-total);
  state.sessions.push({
    id:uid(), taskName:t.taskName, tag:t.tag,
    start:startDate.toISOString(), end:endDate.toISOString(),
    durationMs:total, date:ymd(startDate),
    restMs:t.restMs||0
  });
  state.timer=null; saveState(); refreshAll();
  toast(auto?('暂停超时，已自动结束并记录 '+fmtHM(total)):('已记录 '+fmtHM(total)));
  playSfx('end');
}
function pauseMsLeft(){
  if(!state.timer||!state.timer.paused||!state.timer.pausedAt) return -1;
  return PAUSE_LIMIT_MS-(Date.now()-new Date(state.timer.pausedAt).getTime());
}
function pauseTick(){
  if(!state.timer||!state.timer.paused)return;
  const left=pauseMsLeft();
  if(left<=0){ endTimer(true); return; }
  const el=document.getElementById('pauseCountdown');
  if(el){ const m=Math.floor(left/60000), sec=Math.floor((left%60000)/1000);
    el.textContent='⏳ 还有 '+m+':'+pad(sec)+' 自动结束（休息已计入）'; }
}

/* ============ 音效（Web Audio 实时合成，无需外部文件） ============ */
let audioCtx=null;
let sfxMuted=(localStorage.getItem('cc_sfx_muted')==='1');
function getAudioCtx(){
  if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC();}
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(ctx,type,f0,f1,t0,dur,vol){
  const osc=ctx.createOscillator(); const g=ctx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0) osc.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function playCuteSound(){
  if(sfxMuted) return;
  const ctx=getAudioCtx(); if(!ctx) return;
  const pick=Math.floor(Math.random()*6); const t=ctx.currentTime;
  if(pick===0) tone(ctx,'triangle',520+Math.random()*120,900+Math.random()*180,t,0.12,0.16);
  else if(pick===1){tone(ctx,'sine',1040+Math.random()*220,null,t,0.18,0.13);tone(ctx,'sine',1560+Math.random()*220,null,t+0.005,0.14,0.06);}
  else if(pick===2){const b=523+Math.floor(Math.random()*3)*60;tone(ctx,'triangle',b,null,t,0.13,0.16);tone(ctx,'triangle',b*1.26,null,t+0.07,0.16,0.14);}
  else if(pick===3){const b=320+Math.random()*120;tone(ctx,'square',b,b*2.3,t,0.12,0.09);}
  else if(pick===4){[659,784,988].forEach((f,i)=>tone(ctx,'triangle',f,null,t+i*0.06,0.15,0.12));}
  else {tone(ctx,'square',440+Math.random()*80,null,t,0.07,0.09);tone(ctx,'square',660+Math.random()*80,null,t+0.08,0.10,0.09);}
}
function playSfx(kind){
  if(sfxMuted) return;
  const ctx=getAudioCtx(); if(!ctx) return;
  const t=ctx.currentTime;
  if(kind==='start'){const b=523+Math.floor(Math.random()*2)*40;tone(ctx,'triangle',b,null,t,0.12,0.16);tone(ctx,'triangle',b*1.5,null,t+0.08,0.18,0.14);}
  else if(kind==='end'){tone(ctx,'sine',760,420,t,0.22,0.14);}
  else if(kind==='done'){tone(ctx,'sine',1040,null,t,0.16,0.12);tone(ctx,'sine',1560,null,t+0.05,0.14,0.07);}
  else if(kind==='add'){tone(ctx,'triangle',480+Math.random()*80,820,t,0.12,0.13);}
}
function toggleSfx(){
  sfxMuted=!sfxMuted;
  try{localStorage.setItem('cc_sfx_muted',sfxMuted?'1':'0');}catch(e){}
  const b=document.getElementById('sfxBtn'); if(b) b.textContent=sfxMuted?'🔇':'🔊';
}

/* ============ 小猫模式（右击进入，指针🐱，点哪炸哪；密度/样子完全参照自我介绍页） ============ */
let catOn=false;
const CAT_BURST_EMOJIS=['🐱','⭐','✨','💖','🌟','🌈','🍑','🍓','💎','🌸','🍀','🐰'];
function catAt(x,y){
  const n=8+Math.floor(Math.random()*4);
  let burst=document.getElementById('pinchBurst');
  if(!burst){burst=document.createElement('div');burst.id='pinchBurst';burst.className='pinch-burst';document.body.appendChild(burst);}
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.className='pinch-fly fixed';
    s.textContent=CAT_BURST_EMOJIS[Math.floor(Math.random()*CAT_BURST_EMOJIS.length)];
    const angle=(Math.PI*2*i)/n+Math.random()*0.5;
    const dist=66+Math.random()*56;
    s.style.setProperty('--dx',(Math.cos(angle)*dist).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(angle)*dist-12).toFixed(1)+'px');
    s.style.setProperty('--rot',(Math.random()*60-30).toFixed(1)+'deg');
    s.style.animationDelay=(Math.random()*0.08).toFixed(3)+'s';
    s.style.position='fixed'; s.style.left=x+'px'; s.style.top=y+'px';
    burst.appendChild(s);

    const v=isNaN(saved)?50:saved;
    gr.value=v; applyGlow(v);
    gr.addEventListener('input',()=>{applyGlow(parseFloat(gr.value)); localStorage.setItem('wb_focusdesk_glow',gr.value);});
  }

  refreshAll();
  setInterval(()=>{
    renderClock();
    if(state.timer && state.timer.paused){ pauseTick(); }
    if(state.timer && !state.timer.paused){
      const d=document.querySelector('#timerBody .timer-display');
      const r=document.querySelector('#timerBody .timer-range');
      if(d) d.textContent=fmtHMS(elapsedMs());
      if(r) r.textContent=fmtTimerRange();
    }
  },1000);
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
